<style>
  :root{
    --paper:#EEF0F3;--ink:#16222E;--ink-2:#4A5C6E;--rule:#C9D0D8;--signal:#7D5111;
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#141C24;--ink:#E7EAED;--ink-2:#A2B0BD;--rule:#2F3B47;--signal:#E0A961}
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;
    background:var(--paper);color:var(--ink);
    font-family:"Spectral",Georgia,serif;font-size:1.0625rem;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:40rem;margin:0 auto;padding:3rem clamp(1.25rem,5vw,3rem)}
  h1{font-weight:300;font-size:clamp(2.25rem,8vw,3.5rem);line-height:1;letter-spacing:-.02em;margin:0 0 1rem}
  p{max-width:52ch;color:var(--ink-2);margin:0 0 1.5rem;border-left:2px solid var(--signal);padding-left:1rem}
  a{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.9375rem;font-weight:500;
    color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.2em}
  a:hover{text-decoration-color:var(--signal)}
  a:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
</style>
</head>

  <div class="wrap">
